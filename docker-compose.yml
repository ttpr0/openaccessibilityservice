version: '2.4'
services:
  oas:
    build: ./
    container_name: oas
    restart: always
    networks:
      - node_network
    ports:
      - "5001:5001"
    user: "${UID:-0}:${GID:-0}"
    environment:
      - SERVICE_NAME=oas
      - SERVICE_TAGS=tenancy=dev|prod

networks:
  node_network:
    external: true
